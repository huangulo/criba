name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install ruff

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: criba_test
          POSTGRES_USER: criba
          POSTGRES_PASSWORD: criba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U criba -d criba_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://criba:criba_test@localhost:5432/criba_test
      SYNC_DATABASE_URL: postgresql://criba:criba_test@localhost:5432/criba_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
          load: true
          tags: criba-worker:ci

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
          load: true
          tags: criba-dashboard:ci

      - name: Verify images
        run: |
          docker images | grep criba
          docker run --rm criba-worker:ci python -c "import criba; print('criba import OK')"
          docker run --rm criba-worker:ci python -c "from criba.plugins.registry import discover_plugins, list_plugins; discover_plugins(); print('Plugins:', list_plugins())"
