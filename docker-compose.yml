services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: criba
      POSTGRES_USER: criba
      POSTGRES_PASSWORD: criba_dev
    ports:
      - "5432:5432"
    volumes:
      - criba_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U criba -d criba"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command: alembic upgrade head
    restart: "no"

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TELEGRAM_SESSION_PATH: /app/telegram_session
    command: celery -A criba.celery_app worker -l info
    volumes:
      - ./criba.yml:/app/criba.yml
      - ./criba.yml:/usr/local/lib/python3.12/criba.yml
      - ./telegram_session.session:/app/telegram_session.session
    restart: unless-stopped

  beat:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A criba.celery_app beat -l info
    volumes:
      - ./criba.yml:/app/criba.yml
      - ./criba.yml:/usr/local/lib/python3.12/criba.yml
    restart: unless-stopped

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8030:8000"
    command: uvicorn criba.api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./criba.yml:/app/criba.yml
      - ./criba.yml:/usr/local/lib/python3.12/criba.yml
    restart: unless-stopped
    healthcheck:
      # /health returns 200 while the core dependencies (postgres, redis)
      # are up; an offline Ollama only degrades and still reports 200.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8030
        NEXT_PUBLIC_API_KEY: ${CRIBA_API_KEY:-}
    depends_on:
      - api
    ports:
      - "3030:3000"
    restart: unless-stopped

volumes:
  criba_pgdata:
