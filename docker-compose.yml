services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: criba
      POSTGRES_USER: criba
      POSTGRES_PASSWORD: criba_dev
    ports:
      - "5432:5432"
    volumes:
      - criba_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U criba -d criba"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A criba.celery_app worker -l info
    volumes:
      - ./criba.yml:/app/criba.yml
      - ./criba.yml:/usr/local/lib/python3.12/criba.yml

  beat:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A criba.celery_app beat -l info
    volumes:
      - ./criba.yml:/app/criba.yml
      - ./criba.yml:/usr/local/lib/python3.12/criba.yml

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8030:8000"
    command: uvicorn criba.api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./criba.yml:/app/criba.yml
      - ./criba.yml:/usr/local/lib/python3.12/criba.yml

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8030
    depends_on:
      - api
    ports:
      - "3030:3000"

volumes:
  criba_pgdata:
