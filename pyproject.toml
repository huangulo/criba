[project]
name = "criba"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "atproto>=0.0.50",
    "datasketch>=1.6",
    "fastapi>=0.115",
    "feedparser>=6.0",
    "google-api-python-client>=2.100",
    "httpx>=0.27",
    "lingua-language-detector>=2.0",
    "pgvector>=0.4",
    "pyyaml>=6.0",
    "telethon>=1.37",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
criba-worker = "criba.worker.tasks:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
